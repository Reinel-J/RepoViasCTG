spring.application.name=viactg
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/viasctg_db}
spring.data.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@viasctg.local}
app.password-reset.expiration-minutes=30
# Detrás de un proxy (Caddy/Nginx) toma la IP real de X-Forwarded-For, solo desde proxies internos.
server.forward-headers-strategy=native
