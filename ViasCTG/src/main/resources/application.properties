spring.application.name=viactg
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/viasctg_db}
spring.data.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@viasctg.local}
app.password-reset.expiration-minutes=30
app.email-verification.expiration-hours=48
# "¿Ya lo arreglaron?": días sin cambios antes de preguntar, y hora de la tarea diaria (zona America/Bogota).
app.seguimiento.dias=${SEGUIMIENTO_DIAS:30}
app.seguimiento.cron=${SEGUIMIENTO_CRON:0 0 9 * * *}
# Cierre por la comunidad (apagado por defecto): un reporte EN_PROCESO se propone como resuelto cuando, contando solo los
# votos desde que pasó a EN_PROCESO, hay al menos MINIMO votos «ya está arreglado» y son al menos PROPORCION del total
# (el voto del autor cuenta doble). Si en GRACIA_HORAS nadie lo desmiente ni un moderador lo mantiene abierto, la tarea
# diaria lo pasa a RESUELTO.
app.seguimiento.cierre.habilitado=${CIERRE_COMUNITARIO:false}
app.seguimiento.cierre.minimo-votos=${CIERRE_COMUNITARIO_MINIMO:3}
app.seguimiento.cierre.proporcion=${CIERRE_COMUNITARIO_PROPORCION:0.75}
app.seguimiento.cierre.gracia-horas=${CIERRE_COMUNITARIO_GRACIA_HORAS:72}
# Detrás de un proxy (Caddy/Nginx) toma la IP real de X-Forwarded-For, pero solo si la conexión viene de una IP que
# coincide con TRUSTED_PROXIES (expresión regular de Tomcat, por ejemplo 172\.18\.0\.5). Vacío, el valor por
# defecto, no confía en nadie e ignora la cabecera. El valor por defecto de Tomcat confiaba en cualquier red privada
# (10.x, 172.16-31.x, 192.168.x), y cualquiera en la red local podía saltarse los límites por IP.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:}

# Geocodificación inversa con Nominatim (OpenStreetMap). Su política de uso exige identificar la aplicación
# con un User-Agent propio (idealmente con un contacto real), máximo 1 petición/s y guardar en caché los
# resultados. NOMINATIM_URL vacío desactiva la geocodificación.
app.geocoding.url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
app.geocoding.user-agent=${NOMINATIM_USER_AGENT:ViaCTG/1.0 (+https://github.com/Reinel-J/RepoViasCTG)}

# Área de servicio: un reporte solo se acepta si sus coordenadas caen en este rectángulo
# (área urbana de Cartagena, corregimientos cercanos, Barú e Islas del Rosario). ZONA_HABILITADA=false la desactiva.
app.zona.habilitada=${ZONA_HABILITADA:true}
app.zona.nombre=${ZONA_NOMBRE:Cartagena}
app.zona.lat-min=${ZONA_LAT_MIN:10.15}
app.zona.lat-max=${ZONA_LAT_MAX:10.65}
app.zona.lng-min=${ZONA_LNG_MIN:-75.80}
app.zona.lng-max=${ZONA_LNG_MAX:-75.30}

# Crea las categorías sugeridas en el documento de visión si la colección está vacía.
app.seed.categorias=${SEED_CATEGORIAS:true}

# Swagger UI y OpenAPI; en producción se pueden ocultar con SWAGGER_ENABLED=false.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Actuator: solo /actuator/health (lo usa el healthcheck de Docker), sin detalles de componentes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# El correo no cuenta para la salud: se envía en segundo plano y sus fallos solo se registran. Con él, un SMTP caído
# o sin configurar (docker-compose define SPRING_MAIL_HOST aunque esté vacío) dejaba /actuator/health en DOWN y
# Docker marcaba el backend como unhealthy aunque la API funcionara.
management.health.mail.enabled=false
