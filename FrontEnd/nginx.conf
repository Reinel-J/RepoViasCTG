server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los archivos de assets llevan un hash en el nombre: se pueden cachear para siempre.
    # Si uno no existe (pestaña abierta con un build anterior), 404 en vez de index.html:
    # así el navegador no intenta ejecutar HTML como JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Necesario para que las rutas de react-router (ej. /reportes/123)
    # no den 404 al recargar la página: siempre cae de vuelta a index.html.
    # index.html no se cachea, para que tras un despliegue apunte a los assets nuevos.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
