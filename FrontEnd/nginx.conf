# Esquema con el que llegó el navegador: el del túnel o proxy que esté delante (https) o, si no hay, el de esta
# conexión. El backend lo usa para reconocer que la petición es del mismo sitio y no aplicarle CORS.
map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # La imagen oficial de nginx no comprime por defecto: sin esto el JavaScript viaja ~3 veces más pesado,
    # algo que se nota en datos móviles.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # La API y las fotos pasan por este mismo nginx hacia el backend: así el sitio tiene una sola dirección (lo que
    # necesita el túnel de la demo) y el navegador no hace peticiones a otro origen, sin depender de CORS.
    # "backend" es el servicio de docker-compose.yml; el DNS interno de Docker (127.0.0.11) se consulta en cada
    # petición, así que si el backend se reinicia y cambia de IP no queda un 502 pegado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        # $http_host conserva el puerto (localhost:5173), que el backend compara con el Origin del navegador.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $esquema_original;
        # Cadena de IP hasta aquí; el backend solo la cree si viene de TRUSTED_PROXIES (los límites de intentos van por IP).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 3 fotos de 5 MB (el backend acepta hasta 15 MB por petición) más el resto del formulario.
        client_max_body_size 16m;
    }

    location /uploads/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }

    # Los archivos de assets llevan un hash en el nombre: se pueden cachear para siempre.
    # Si uno no existe (pestaña abierta con un build anterior), 404 en vez de index.html:
    # así el navegador no intenta ejecutar HTML como JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Necesario para que las rutas de react-router (ej. /reportes/123)
    # no den 404 al recargar la página: siempre cae de vuelta a index.html.
    # index.html no se cachea, para que tras un despliegue apunte a los assets nuevos.
    # (add_header no se hereda entre bloques location: por eso los encabezados de seguridad van aquí.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # Las teselas de OpenStreetMap piden un Referer; con esta política solo viaja el dominio, nunca la ruta
        # (por ejemplo, el token de /restablecer?token=...).
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    }
}
