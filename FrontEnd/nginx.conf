server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Necesario para que las rutas de react-router (ej. /reportes/123)
    # no den 404 al recargar la página: siempre cae de vuelta a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
