server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # La imagen oficial de nginx no comprime por defecto: sin esto el JavaScript viaja ~3 veces más pesado,
    # algo que se nota en datos móviles.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Los archivos de assets llevan un hash en el nombre: se pueden cachear para siempre.
    # Si uno no existe (pestaña abierta con un build anterior), 404 en vez de index.html:
    # así el navegador no intenta ejecutar HTML como JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Necesario para que las rutas de react-router (ej. /reportes/123)
    # no den 404 al recargar la página: siempre cae de vuelta a index.html.
    # index.html no se cachea, para que tras un despliegue apunte a los assets nuevos.
    # (add_header no se hereda entre bloques location: por eso los encabezados de seguridad van aquí.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # Las teselas de OpenStreetMap piden un Referer; con esta política solo viaja el dominio, nunca la ruta
        # (por ejemplo, el token de /restablecer?token=...).
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    }
}
