services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Solo accesible desde esta máquina: MongoDB corre sin usuario ni contraseña y Docker publica los puertos
    # saltándose firewalls como UFW. El backend lo alcanza por la red interna de Compose (mongo:27017).
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./ViasCTG
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/viasctg_db
      JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET en el archivo .env (openssl rand -base64 32)}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      MAIL_FROM: ${MAIL_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      UPLOADS_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      NOMINATIM_USER_AGENT: "${NOMINATIM_USER_AGENT:-ViaCTG/1.0 (+https://github.com/Reinel-J/RepoViasCTG)}"
      ZONA_HABILITADA: ${ZONA_HABILITADA:-true}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./FrontEnd
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_NOTIFICACIONES_INTERVALO_MS: ${VITE_NOTIFICACIONES_INTERVALO_MS:-60000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads_data:
